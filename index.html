<!DOCTYPE html>
<html lang="id">
<head>

    <title>Portal Utama - Game Edukasi SD</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; text-align: center; }

        h1 { color: #1e3a8a; margin-bottom: 5px; }
        p { color: #4b5563; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: #1f2937; font-weight: bold; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; border: 2px solid #3b82f6; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); background: #eff6ff; }
        .badge { font-size: 12px; background: #2563eb; color: white; padding: 2px 8px; border-radius: 20px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Portal Game Edukasi SD</h1>

</html>
